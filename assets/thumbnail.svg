<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0221"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF10F0"/>
      <stop offset="50%" style="stop-color:#00FFF0"/>
      <stop offset="100%" style="stop-color:#FF10F0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g stroke="#00FFF0" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Decorative horizontal lines -->
  <rect x="60" y="150" width="180" height="2" fill="#FF10F0" filter="url(#glow)" opacity="0.8"/>
  <rect x="960" y="150" width="180" height="2" fill="#00FFF0" filter="url(#glow)" opacity="0.8"/>
  <rect x="60" y="478" width="180" height="2" fill="#00FFF0" filter="url(#glow)" opacity="0.8"/>
  <rect x="960" y="478" width="180" height="2" fill="#FF10F0" filter="url(#glow)" opacity="0.8"/>

  <!-- Corner accents -->
  <path d="M40 40 L40 80 M40 40 L80 40" stroke="#00FFF0" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M1160 40 L1160 80 M1160 40 L1120 40" stroke="#00FFF0" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M40 590 L40 550 M40 590 L80 590" stroke="#FF10F0" stroke-width="3" fill="none" filter="url(#glow)"/>
  <path d="M1160 590 L1160 550 M1160 590 L1120 590" stroke="#FF10F0" stroke-width="3" fill="none" filter="url(#glow)"/>

  <!-- Main title -->
  <text x="600" y="280" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="96" font-weight="900" fill="#FF10F0" filter="url(#glowStrong)">NEON</text>
  <text x="600" y="280" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="96" font-weight="900" fill="#FF10F0">NEON</text>

  <text x="600" y="380" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="96" font-weight="900" fill="#00FFF0" filter="url(#glowStrong)">FLUX</text>
  <text x="600" y="380" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="96" font-weight="900" fill="#00FFF0">FLUX</text>

  <!-- Subtitle -->
  <text x="600" y="450" text-anchor="middle" font-family="'Space Mono', 'Courier New', monospace" font-size="20" fill="#00FFF0" opacity="0.8">CYBERPUNK NEXT.JS TEMPLATE</text>

  <!-- Tech badges -->
  <g font-family="'Space Mono', 'Courier New', monospace" font-size="14">
    <rect x="380" y="500" width="100" height="28" rx="4" fill="#0A0A0A" stroke="#FF10F0" stroke-width="1"/>
    <text x="430" y="519" text-anchor="middle" fill="#FF10F0">NEXT.JS 16</text>

    <rect x="500" y="500" width="100" height="28" rx="4" fill="#0A0A0A" stroke="#00FFF0" stroke-width="1"/>
    <text x="550" y="519" text-anchor="middle" fill="#00FFF0">GSAP</text>

    <rect x="620" y="500" width="100" height="28" rx="4" fill="#0A0A0A" stroke="#B026FF" stroke-width="1"/>
    <text x="670" y="519" text-anchor="middle" fill="#B026FF">TAILWIND</text>

    <rect x="740" y="500" width="100" height="28" rx="4" fill="#0A0A0A" stroke="#FFFF00" stroke-width="1"/>
    <text x="790" y="519" text-anchor="middle" fill="#FFFF00">TYPESCRIPT</text>
  </g>

  <!-- Scan line effect -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#neonGrad)" opacity="0.02"/>
</svg>
